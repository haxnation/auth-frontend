<!DOCTYPE html>

<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
    <link rel="shortcut icon" href="/favicons/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />

    <link rel="manifest" href="/favicons/site.webmanifest" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: '#fafafa', ink: '#0b0b0b',
                        cyan: '#5ce1e6', danger: '#ff2a2a',
                        success: '#00e676', warning: '#ffeb3b'
                    },
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .btn-primary {
                @apply font-mono uppercase tracking-widest font-bold bg-cyan text-ink border-2 border-ink px-6 py-3 shadow-[4px_4px_0_0_#0b0b0b] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0_0_#0b0b0b] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all duration-75 focus:outline-none focus:ring-2 focus:ring-cyan focus:ring-offset-2;
            }
            .btn-danger {
                @apply font-mono uppercase tracking-widest font-bold bg-danger text-white border-2 border-ink px-6 py-3 shadow-[4px_4px_0_0_#0b0b0b] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[2px_2px_0_0_#0b0b0b] active:translate-x-[4px] active:translate-y-[4px] active:shadow-none transition-all duration-75 focus:outline-none focus:ring-2 focus:ring-danger focus:ring-offset-2;
            }
            .btn-secondary {
                @apply font-mono text-xs font-bold uppercase tracking-widest bg-white text-ink border-2 border-ink px-4 py-2 hover:bg-ink hover:text-white transition-colors duration-0 shadow-[2px_2px_0_0_#0b0b0b] focus:outline-none focus:ring-2 focus:ring-ink focus:ring-offset-2;
            }
            .card {
                @apply bg-white border-2 border-ink p-6 shadow-[6px_6px_0_0_#0b0b0b] hover:translate-x-[2px] hover:translate-y-[2px] hover:shadow-[4px_4px_0_0_#0b0b0b] transition-all duration-75;
            }
            .input {
                @apply border-2 border-ink bg-white p-3 font-mono text-sm rounded-none focus:outline-none focus:ring-0 focus:border-cyan focus:bg-ink focus:text-cyan transition-colors duration-75 w-full shadow-[inset_2px_2px_0_0_#e5e5e5];
            }
            .label {
                @apply font-mono text-[10px] font-bold uppercase mb-1 block text-ink;
            }
        }
    </style>
</head>
<body class="font-sans min-h-screen text-ink bg-canvas bg-[linear-gradient(to_right,#80808020_1px,transparent_1px),linear-gradient(to_bottom,#80808020_1px,transparent_1px)] bg-[size:32px_32px] selection:bg-cyan selection:text-ink">
    
    <div id="app" class="w-full min-h-screen flex flex-col items-center justify-center p-4">
        <div class="flex flex-col items-center justify-center min-h-[50vh] gap-8">
            <img src="/logo.png" alt="Haxnation Auth" class="h-16 w-auto object-contain">
            <div class="w-12 h-12 bg-black border-4 border-[#5ce1e6] shadow-[4px_4px_0_0_#5ce1e6] animate-[spin_1s_steps(4)_infinite]"></div>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>

    <!-- Global Interaction Loader -->
    <div id="global-loader" class="fixed top-0 left-0 w-full h-1 bg-transparent z-[9999] pointer-events-none hidden">
        <div class="h-full bg-cyan animate-[pulse_1s_ease-in-out_infinite] w-1/3 relative left-0 transition-all duration-300 shadow-[0_0_8px_theme('colors.cyan')]"></div>
    </div>
    <script>
        document.addEventListener('click', (e) => {
            const el = e.target.closest('button, a');
            if (el) {
                const loader = document.getElementById('global-loader');
                if (loader) {
                    loader.classList.remove('hidden');
                    
                    // Simple animation for the progress bar
                    const bar = loader.firstElementChild;
                    bar.style.left = '0%';
                    let pos = 0;
                    const interval = setInterval(() => {
                        pos += 5;
                        if(pos > 100) pos = -30;
                        bar.style.left = pos + '%';
                    }, 50);

                    // Auto-hide after 2 seconds if router doesn't hide it (fallback)
                    setTimeout(() => {
                        clearInterval(interval);
                        loader.classList.add('hidden');
                    }, 2000);
                }
            }
        });
    </script>


<!-- PWA Install Prompt & Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('SW registered!', reg);
            }).catch(err => console.log('SW registration failed', err));
        });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showPwaToast();
    });

    function showPwaToast() {
        if (document.getElementById('pwa-install-toast')) return;
        
        const toastHtml = `
            <div id="pwa-install-toast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99999; background: #fff; border: 2px solid #0b0b0b; box-shadow: 4px 4px 0 0 #0b0b0b; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 90vw; width: 350px; font-family: 'JetBrains Mono', monospace, sans-serif;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img src="/logo.png" alt="Logo" style="width: 32px; height: 32px; object-fit: contain;">
                    <div>
                        <h4 style="margin: 0; font-size: 14px; font-weight: bold; color: #0b0b0b;">Install Haxnation Auth</h4>
                        <p style="margin: 4px 0 0; font-size: 11px; color: #666;">Add to Home Screen</p>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-pwa-dismiss" style="background: transparent; border: none; font-size: 20px; cursor: pointer; color: #666;">&times;</button>
                    <button id="btn-pwa-install" style="background: #5ce1e6; color: #0b0b0b; border: 2px solid #0b0b0b; padding: 6px 12px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 2px 2px 0 0 #0b0b0b;">Install</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', toastHtml);

        document.getElementById('btn-pwa-dismiss').addEventListener('click', () => {
            document.getElementById('pwa-install-toast').remove();
        });

        document.getElementById('btn-pwa-install').addEventListener('click', async () => {
            document.getElementById('pwa-install-toast').remove();
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            }
        });
    }
</script>

</body>
</html>
